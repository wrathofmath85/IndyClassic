<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Around Indy – 2027 Indy Classic</title>
<meta name="description" content="Restaurants, bars, sights and museums in Indianapolis for Indy Classic players.">
<meta name="theme-color" content="#070b14">
<meta property="og:title" content="Around Indy – 2027 Indy Classic">
<meta property="og:description" content="Restaurants, bars, sights and museums in Indianapolis for Indy Classic players.">
<meta property="og:image" content="profile.jpg.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
<link rel="apple-touch-icon" href="profile.jpg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=2027a">
<script src="config.js?v=2027a" defer></script>
<script src="site.js?v=2027a" defer></script>
</head>
<body data-page="around">
<main class="page" id="app">
  <div class="page-head">
    <div class="eyebrow">2027 Indy Classic</div>
    <h1 class="h1">Around Indy</h1>
    <p class="lead">Where to eat, drink and explore while you're in town. Sponsors are marked — please show them some love!</p>
  </div>

  <input class="input" id="q" type="search" placeholder="Search places…" autocomplete="off" aria-label="Search places">
  <div class="chips" id="chips"></div>
  <div id="list"><div class="skel" style="height:90px;margin-top:12px"></div><div class="skel" style="height:90px;margin-top:10px"></div><div class="skel" style="height:90px;margin-top:10px"></div></div>

  <a class="callout sky mt20" href="https://www.visitindy.com" target="_blank" rel="noopener noreferrer">
    <div class="ic">🏙️</div><div><div class="t">More to explore — VisitIndy.com ↗</div><div class="s">Events and activities happening in Indianapolis during your stay</div></div>
  </a>
</main>

<style>
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;padding:8px 13px;border-radius:999px;cursor:pointer}
  .chip.on{background:var(--ball);color:var(--on-ball);border-color:var(--ball)}
  .grp{margin-top:20px}
  .places{display:grid;gap:8px}
  @media(min-width:640px){.places{grid-template-columns:1fr 1fr}}
  .place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
  .place.sp{border-color:rgba(212,245,60,.35);background:linear-gradient(150deg,rgba(212,245,60,.09),transparent 60%),var(--surface)}
  .place .n{font-weight:800;font-size:15px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .place .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .place .addr{font-size:12.5px;color:var(--muted);margin-top:3px}
</style>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const { esc } = window.ICsite;
  const TYPES = [
    { key:"LGBT Restaurant", title:"🍽️ LGBT Restaurants" },
    { key:"LGBT Bar",        title:"🍸 LGBT Bars" },
    { key:"Sights",          title:"📸 Sights" },
    { key:"Museums/Cultur",  title:"🏛️ Museums" },
    { key:"Nature",          title:"🌿 Nature" },
  ];
  let all = [], cat = "all";
  const list = document.getElementById("list"), q = document.getElementById("q"), chips = document.getElementById("chips");

  function parseCSV(text){ const rows=[]; let row=[],cur="",inQ=false;
    for(let i=0;i<text.length;i++){ const c=text[i],n=text[i+1];
      if(c=='"'){ if(inQ&&n=='"'){cur+='"';i++;} else inQ=!inQ; }
      else if(c==","&&!inQ){row.push(cur);cur="";}
      else if((c=="\n"||c=="\r")&&!inQ){ if(c=="\r"&&n=="\n")i++; row.push(cur);rows.push(row);row=[];cur=""; }
      else cur+=c; }
    if(cur.length||row.length){row.push(cur);rows.push(row);} return rows; }
  const link = u => !u ? "" : (/^https?:\/\//i.test(u) ? u : "https://"+u);
  const map = a => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a);

  function render(){
    const term = q.value.trim().toLowerCase();
    const groups = TYPES.filter(t => cat==="all" || cat===t.key).map(t => {
      const items = all.filter(x => x.type===t.key && (!term || (x.name+" "+x.address).toLowerCase().includes(term)))
        .sort((a,b)=> (b.sponsor-a.sponsor) || a.name.localeCompare(b.name));
      return { ...t, items };
    }).filter(g => g.items.length);
    list.innerHTML = groups.length ? groups.map(g => `<section class="grp"><div class="sec-title">${g.title}<span class="r faint">${g.items.length}</span></div>
      <div class="places">${g.items.map(x => `<div class="place${x.sponsor?" sp":""}"><div class="n"><span>${esc(x.name)}</span>${x.sponsor?'<span class="pill ball">🏆 Sponsor</span>':""}</div>
        ${x.address?`<div class="addr">${esc(x.address)}</div>`:""}
        <div class="acts">${x.address?`<a class="pill sky" href="${map(x.address)}" target="_blank" rel="noopener">📍 Map</a>`:""}${x.web?`<a class="pill" href="${esc(link(x.web))}" target="_blank" rel="noopener">🌐 Website</a>`:""}</div></div>`).join("")}</div></section>`).join("")
      : `<p class="empty mt16">No places match “${esc(q.value)}”.</p>`;
  }
  function drawChips(){
    const present = TYPES.filter(t => all.some(x => x.type===t.key));
    chips.innerHTML = [`<button class="chip on" data-k="all">All · ${all.length}</button>`, ...present.map(t => `<button class="chip" data-k="${esc(t.key)}">${t.title}</button>`)].join("");
    chips.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { cat=b.dataset.k; chips.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b)); render(); }));
  }
  async function load(){
    try{
      const url = window.IC.aroundIndyCsv; const r = await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(), { cache:"no-store" });
      if(!r.ok) throw new Error(r.status);
      const rows = parseCSV(await r.text()); const H = rows[0].map(h=>h.trim().toLowerCase()); const ix = n => H.indexOf(n);
      const [iT,iN,iA,iS,iW] = ["type","name","address","sponsor","web"].map(ix);
      if([iT,iN,iA,iS,iW].some(i=>i<0)) throw new Error("Spreadsheet columns changed");
      all = rows.slice(1).map(r => ({ type:(r[iT]||"").trim(), name:(r[iN]||"").trim(), address:(r[iA]||"").trim(), sponsor:(r[iS]||"").trim().toLowerCase()==="yes", web:(r[iW]||"").trim() }))
        .filter(x => x.type && x.name && TYPES.some(t=>t.key===x.type));
      drawChips(); render();
    }catch(e){
      list.innerHTML = `<div class="err mt16">Couldn't load places right now. <button class="btn sm mt8" id="retry">↻ Try again</button></div>`;
      document.getElementById("retry").onclick = load;
    }
  }
  q.addEventListener("input", render);
  load();
});
</script>
</body>
</html>
