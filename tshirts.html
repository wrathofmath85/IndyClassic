<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Shirts – 2027 Indy Classic</title>

  <!-- Favicon: tennis ball emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#0a0f1a; --ink-2:#0d1424; --ink-3:#111a2d;
      --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.06);
      --text:rgba(236,242,251,.94); --muted:rgba(236,242,251,.56); --faint:rgba(236,242,251,.38);
      --accent:#38bdf8; --accent-2:#7dd3fc;
      --radius:16px; --radius-lg:20px; --shadow:0 24px 60px rgba(0,0,0,.45);
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{min-height:100%;}
    body{
      font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text); background:var(--ink); min-height:100vh;
      display:flex; align-items:flex-start; justify-content:center;
      padding:32px 24px 40px; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative;
    }
    .court{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
    .court::before{content:"";position:absolute;top:-260px;left:50%;width:820px;height:620px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(56,189,248,.16),transparent 70%);filter:blur(8px);}
    .court-lines{position:absolute;inset:0;opacity:.5;}
    .court-lines line{stroke:rgba(255,255,255,.05);stroke-width:1;}
    .court-lines .net{stroke:rgba(56,189,248,.10);}

    .container{width:min(860px,100%);position:relative;z-index:1;}

    .back-link{
      display:inline-flex;align-items:center;gap:6px;color:var(--muted);
      font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.04em;
      text-decoration:none;margin-bottom:14px;padding:8px 14px;border-radius:999px;
      background:var(--ink-3);border:1px solid var(--line);transition:color .18s,border-color .18s;
      -webkit-tap-highlight-color:transparent;
    }
    .back-link:hover{color:var(--text);border-color:rgba(255,255,255,.2);}

    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 130px),var(--ink-2);
      border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);
      padding:32px 28px;text-align:center;position:relative;overflow:hidden;
    }
    .card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(56,189,248,.55),transparent);}

    .logo-wrap{display:flex;justify-content:center;margin-bottom:20px;}
    .logo-box{width:min(100%,230px);padding:11px;border-radius:16px;background:#fff;border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 28px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;}
    .logo{width:100%;max-width:208px;height:auto;display:block;object-fit:contain;}

    h1{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;margin-bottom:8px;letter-spacing:-.01em;}
    .subtitle{font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}

    .info-note{
      display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--accent-2);
      background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.24);border-radius:999px;
      padding:8px 16px;margin-bottom:28px;
    }

    .shirt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
    .shirt-item{
      background:rgba(255,255,255,.035);border:1px solid var(--line-soft);border-radius:var(--radius);
      padding:16px 16px 14px;transition:transform .2s ease,border-color .2s ease;
      -webkit-tap-highlight-color:transparent;
    }
    @media (hover:hover) and (pointer:fine){
      .shirt-item:hover{transform:translateY(-4px);border-color:rgba(56,189,248,.35);}
    }
    .shirt-item:active{transform:scale(.99);}
    .shirt-item img{width:100%;border-radius:10px;object-fit:contain;aspect-ratio:1/1;background:rgba(255,255,255,.04);}

    .shirt-label{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;}
    .color-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1px solid rgba(255,255,255,.25);}
    .shirt-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;}

    footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line-soft);font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.06em;color:var(--faint);}

    @media (max-width:600px){.shirt-grid{grid-template-columns:repeat(2,1fr);gap:14px;}}
    @media (max-width:400px){
      body{padding:20px 16px 32px;}
      .card{padding:24px 16px;}
      h1{font-size:25px;} .shirt-grid{gap:12px;}
    }
    @media (prefers-reduced-motion:reduce){.shirt-item,.back-link{transition:none;} .shirt-item:active{transform:none;}}
  </style>
</head>
<body>

  <div class="court" aria-hidden="true">
    <svg class="court-lines" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice">
      <line x1="120" y1="120" x2="880" y2="120"/><line x1="120" y1="1280" x2="880" y2="1280"/>
      <line x1="200" y1="120" x2="200" y2="1280"/><line x1="800" y1="120" x2="800" y2="1280"/>
      <line x1="200" y1="440" x2="800" y2="440"/><line x1="200" y1="960" x2="800" y2="960"/>
      <line x1="500" y1="440" x2="500" y2="960"/><line class="net" x1="120" y1="700" x2="880" y2="700"/>
    </svg>
  </div>

  <div class="container">

    <a href="index.html" class="back-link">← Home</a>

    <div class="card">

      <div class="logo-wrap">
        <div class="logo-box">
          <img src="profile.jpg.png" alt="2027 Indy Classic Logo" class="logo">
        </div>
      </div>

      <h1>2027 Indy Classic T-Shirts</h1>
      <div class="subtitle">Choose your style for this year's event</div>

      <div class="info-note">
        👕 Shirts are included with registration — choose your color when signing up
      </div>

      <div class="shirt-grid">
        <div class="shirt-item">
          <img src="shirt1.jpg" alt="Black T-Shirt">
          <div class="shirt-label"><span class="color-dot" style="background:#1a1a1a;"></span><span class="shirt-title">Black</span></div>
        </div>
        <div class="shirt-item">
          <img src="shirt2.jpg" alt="Aqua T-Shirt">
          <div class="shirt-label"><span class="color-dot" style="background:#22d3ee;"></span><span class="shirt-title">Aqua</span></div>
        </div>
        <div class="shirt-item">
          <img src="shirt3.jpg" alt="Cardinal T-Shirt">
          <div class="shirt-label"><span class="color-dot" style="background:#9f1239;"></span><span class="shirt-title">Cardinal</span></div>
        </div>
      </div>

      <footer>© 2027 Indy Classic</footer>

    </div>
  </div>

</body>
</html>
